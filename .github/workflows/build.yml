name: build-iso
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WinRescue-ISO
          path: |
            WinRescue.iso
            WinRescue.iso.sha256
